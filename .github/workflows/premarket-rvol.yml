name: Premarket RVOL scan

on:
  schedule:
    # One time is 9:00 AM New York; the runner ignores the other after DST changes.
    - cron: "0 13,14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the premarket RVOL scan
        run: python scripts/run_premarket_rvol.py

      - name: Commit the premarket results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/premarket_rvol_*.csv outputs/.last_premarket_rvol_run.txt premarket_rvol.html
          git diff --cached --quiet || git commit -m "Update premarket RVOL scan for $(date -u +%F)"
          git push
