name: Refresh Stockbee breadth

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Capture ETF after-hours session"]
    types: [completed]
    branches: [main]
  schedule:
    # Retries after the regular close and overnight, guarded in New York time.
    - cron: "11,31,51 20-23 * * 1-5"
    - cron: "13,43 0-4 * * 2-6"
    - cron: "17,47 9-14 * * 2-6"

permissions:
  contents: write
  pages: write

concurrency:
  group: nel-breadth
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Breadth dependencies
        run: pip install requests yfinance

      - name: Check Stockbee for a published close
        run: python scripts/refresh_breadth_after_close.py

      - name: Publish only when the source changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add breadth.html outputs/breadth_market_monitor.json outputs/spx_history.json
          if git diff --cached --quiet; then exit 0; fi
          python scripts/build_debrief_data.py
          git add outputs/debrief_data.json
          git commit -m "Refresh Stockbee breadth for $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
              exit 0
            fi
          done
          exit 1
