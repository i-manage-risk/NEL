name: Daily NEL scan

on:
  schedule:
    # Repeated post-close attempts cover DST, delays and temporary provider outages.
    - cron: "25,55 20-23 * * 1-5"
    - cron: "25,55 0-3 * * 2-6"
    # Overnight/morning catch-up; the guard blocks intraday stock scans.
    - cron: "15 12,13 * * 1-6"
  workflow_dispatch:
    inputs:
      force:
        description: Recheck completed stock stages as well as failed ones
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: nel-repository-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select completed session
        id: session
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from scripts.run_after_close import scheduled_close, NY_TZ
          close = scheduled_close(datetime.now(NY_TZ))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('run=' + ('true' if close else 'false') + '\n')
          print('Refreshing close:', close, '| intraday scans are blocked')
          PY

      - name: Install dependencies
        if: steps.session.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Refresh stock screens and ETF studies
        id: scan
        if: steps.session.outputs.run == 'true'
        continue-on-error: true
        env:
          FORCE_STOCK_REFRESH: ${{ inputs.force || 'false' }}
        run: python -u scripts/run_after_close.py

      - name: Refresh daily breadth monitor
        id: breadth
        if: steps.session.outputs.run == 'true'
        continue-on-error: true
        run: python -u breadth_dashboard.py

      - name: Refresh index histories
        id: indexes
        if: steps.session.outputs.run == 'true'
        continue-on-error: true
        run: python -u index_history.py

      - name: Refresh RSP market overview
        id: flow
        if: steps.session.outputs.run == 'true'
        continue-on-error: true
        run: python -u flow_market_data.py

      - name: Refresh benchmark context
        if: steps.session.outputs.run == 'true'
        continue-on-error: true
        run: python market_context.py

      - name: Build workspace from preserved scans
        if: steps.session.outputs.run == 'true'
        run: python workspace_data.py

      - name: Commit all successfully refreshed datasets
        if: steps.session.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs industry_flow_dashboard.html index.html super-liquid.html themes.html sectors.html breadth.html data/etf_holdings_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh completed market data for $(date -u +%F)"
            git pull --rebase origin main
            git push || (git pull --rebase origin main && git push)
            gh api --method POST repos/${{ github.repository }}/pages/builds
          fi

      - name: Preserve detailed scanner logs
        if: always() && steps.session.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scanner-logs-${{ github.run_id }}
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Report incomplete refreshes for automatic retry
        if: >-
          steps.scan.outcome == 'failure' || steps.breadth.outcome == 'failure' ||
          steps.indexes.outcome == 'failure' || steps.flow.outcome == 'failure'
        run: |
          echo "One or more sources failed. Successful datasets were published; the next scheduled run retries incomplete stock stages."
          exit 1
