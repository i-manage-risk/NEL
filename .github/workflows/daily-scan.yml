name: Daily NEL scan

on:
  # Independent existing refresh jobs also wake the close scanner if its cron is delayed.
  workflow_run:
    workflows: ["Refresh Stockbee breadth", "Capture ETF after-hours session"]
    types: [completed]
    branches: [main]
  schedule:
    # Five-minute post-close / overnight attempts; the NY guard handles DST.
    - cron: "*/5 20-23 * * 1-5"
    - cron: "*/5 0-13 * * 2-6"
  workflow_dispatch:
    inputs:
      force:
        description: Recheck completed stock stages as well as failed ones
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: nel-repository-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select completed session
        id: session
        env:
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from scripts.run_after_close import scheduled_close, NY_TZ
          from scripts.refresh_pages import freshness
          now = datetime.now(NY_TZ)
          close = scheduled_close(now)
          current = close is not None and all(s['current'] for s in freshness(close, now).values())
          needed = close is not None and (not current or os.environ.get('FORCE_REFRESH') == 'true')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('run=' + ('true' if needed else 'false') + '\n')
          print('Target close:', close, '| all pages current:', current, '| refresh needed:', needed)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## Page freshness\nTarget close: **{close}** · Already current: **{current}** · Refresh needed: **{needed}**\n')
          PY

      - name: Install dependencies
        if: steps.session.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Retry each stale source every five minutes and publish progress
        if: steps.session.outputs.run == 'true'
        env:
          FORCE_STOCK_REFRESH: ${{ inputs.force || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/refresh_pages.py --watch-minutes 35 --publish

      - name: Preserve detailed scanner logs
        if: always() && steps.session.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scanner-logs-${{ github.run_id }}
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 7

