name: Refresh official CFTC positioning
on:
  schedule:
    - cron: '30 22 * * 5'
    - cron: '30 14 * * 6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nel-repository-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python positioning.py
      - name: Publish official weekly observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/positioning.json
          git diff --cached --quiet || git commit -m "Refresh official CFTC positioning"
          git pull --rebase
          git push
