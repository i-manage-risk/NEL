name: Refresh Scans watchlist

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily NEL scan", "Capture ETF after-hours session"]
    types: [completed]
    branches: [main]
  schedule:
    # UTC pairs cover both offsets. The scanner applies New York market hours.
    - cron: "2,7,12 13,14 * * 1-5"
    - cron: "17,32,47 14-21 * * 1-5"
    - cron: "23,38 17,18,20,21 * * 1-5"
    - cron: "11 22,23 * * 1-5"
    - cron: "45 12,13 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: nel-scan-watchlist
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture scans and watchlist
        id: refresh
        run: python -u nel2/publish.py
      - name: Publish changed snapshots
        if: ${{ !cancelled() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add outputs/scan_watchlist.json outputs/scan_bucket_history
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Scans watchlist'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
              exit 0
            fi
          done
          exit 1
