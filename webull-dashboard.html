<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Webull Focus List</title>
  <style>
    :root {
      --cream: #f4f2e8;
      --black: #080808;
      --dark: #141414;
      --light: #2a2a2a;
      --green: #00c853;
      --red: #ff3b30;
      --muted: #9b9b95;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--black);
      color: var(--cream);
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell { max-width: 1120px; margin: 48px auto; padding: 0 20px; }
    .top { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 14px; }
    .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 3px 0 0; font-size: 25px; line-height: 1.1; }
    .status { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    .controls { display: flex; gap: 8px; margin: 12px 0; }
    .controls input { flex: 1; min-width: 0; background: #171717; border: 1px solid #333; color: var(--cream); padding: 10px 12px; border-radius: 7px; }
    button { border: 0; border-radius: 7px; padding: 10px 15px; background: var(--cream); color: #000; font-weight: 700; cursor: pointer; }
    .notice { display: none; background: #471816; color: #ffaaa4; padding: 12px; margin-bottom: 10px; border-radius: 6px; line-height: 1.45; }
    .notice code { color: var(--cream); }
    .table-wrap { overflow: auto; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th { background: var(--cream); color: #000; text-align: center; padding: 10px 13px; font-weight: 800; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    td { text-align: center; padding: 9px 13px; white-space: nowrap; }
    tbody tr:nth-child(odd) { background: var(--dark); }
    tbody tr:nth-child(even) { background: var(--light); }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .cream { color: var(--cream); }
    .qualified { background: var(--green) !important; color: #000 !important; font-weight: 800; }
    .symbol { font-weight: 750; }
    .foot { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .empty { text-align: center !important; padding: 30px; }

    @media (max-width: 640px) {
      .shell { margin-top: 24px; padding: 0 12px; }
      .top { align-items: start; }
      .controls { flex-direction: column; }
      .controls button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div>
        <div class="eyebrow">Webull OpenAPI</div>
        <h1>Focus List</h1>
      </div>
      <div class="status">
        <div id="env">LOCAL SERVICE</div>
        <div id="updated">Connecting…</div>
      </div>
    </div>

    <div class="controls">
      <input id="symbols" spellcheck="false" aria-label="Watchlist symbols" placeholder="AAPL, MSFT, NVDA">
      <button type="button" id="updateButton">Update</button>
    </div>

    <div id="notice" class="notice"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Symbol</th>
            <th>RVOL</th>
            <th>LoD</th>
            <th>Range</th>
            <th>PDH</th>
            <th>OR</th>
            <th>P &gt; ORH</th>
            <th>Delay</th>
          </tr>
        </thead>
        <tbody id="body">
          <tr><td colspan="8" class="empty">Connecting to the local Webull service…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="foot">RTH only · RVOL 50D · ATR 14 · auto-refresh every 10 seconds · Webull credentials stay on your computer</div>
  </main>

  <script src="assets/webull-dashboard.js" defer></script>
</body>
</html>
